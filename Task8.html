<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Media Hub</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background-color: #f2f2f2;
        }

        h1 {
            color: #173f5f;
        }

        section {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
        }

        iframe {
            border: none;
        }
    </style>
</head>

<body>
    <section>
    <h2>YouTube Video</h2>

    <iframe
        width="560"
        height="315"
        src="https://www.youtube.com/watch?v=eWgBcKTIwOo"
        title="YouTube Video Player"
        frameborder="0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen>
    </iframe>
    </section>
     <section>
        <h2>Local Video</h2>

        <video width="560" controls>

            <source src="Cosmi.mp4" type="video/mp4">


        </video>
    </section>
    <section>
    <h2>Audio Clip</h2>

    <audio controls>
        <source src="Pop up.wav" type="audio/wav">

        Your browser does not support the audio element.
    </audio>
</section>
 <section>
        <h2>PCPS College Location</h2>

        <iframe
            width="600"
            height="400"
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3533.0625942560173!2d85.317011!3d27.6844602!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x39eb19b5ad9b8dff%3A0x12a4b82675e789a3!2sPatan%20College%20For%20Professional%20Studies!5e0!3m2!1sen!2snp!4v1790235556282!5m2!1sen!2snp" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin">
        </iframe>
    </section>
   <section>
    <h2>External Webpage</h2>

    <iframe
        src="https://www.wikipedia.org"
        width="600"
        height="300">
    </iframe>
    </section>
     <section>
        <h2>PDF Document</h2>

        <embed
            src="H.pdf"
            type="application/pdf"
            width="600"
            height="500">
    </section>
</body>
</html>
